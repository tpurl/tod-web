<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>tod-web</title>
    <style>
      :root {
        --key: #2e2e2e;
        --key-down: #555;
        --key-edge: #151515;
        --label: #ccc;
        --accent: #d4c154;
      }
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        height: 100dvh;
        display: grid;
        grid-template:
          "stage" 1fr
          "actions" auto / 1fr;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #stage {
        grid-area: stage;
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        touch-action: none;
      }
      #screen {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        image-rendering: pixelated;
        outline: none;
      }
      .pad { display: none; }

      /* Touch layout: portrait puts controls under the screen, landscape beside it. */
      body.touch {
        grid-template:
          "stage stage" 1fr
          "actions actions" auto
          "left right" auto / 1fr 1fr;
        padding-bottom: env(safe-area-inset-bottom);
      }
      @media (orientation: landscape) {
        body.touch {
          grid-template:
            "left stage right" 1fr
            "left actions right" auto / auto 1fr auto;
          padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
        }
      }
      body.touch .pad {
        display: grid;
        align-content: center;
        justify-content: center;
        padding: 12px;
        gap: 10px;
        touch-action: none;
      }
      #pad-left { grid-area: left; }
      #pad-right { grid-area: right; }

      .dpad {
        display: grid;
        grid-template: repeat(3, 56px) / repeat(3, 56px);
        gap: 4px;
      }
      .dpad [data-key="up"] { grid-area: 1 / 2; }
      .dpad [data-key="left"] { grid-area: 2 / 1; }
      .dpad [data-key="right"] { grid-area: 2 / 3; }
      .dpad [data-key="down"] { grid-area: 3 / 2; }

      .keys {
        display: grid;
        grid-template-columns: repeat(2, 76px);
        gap: 10px;
      }
      .keys .wide { grid-column: span 2; }

      .pad button {
        min-height: 56px;
        border: 0;
        border-radius: 6px;
        background: var(--key);
        box-shadow: inset 0 -4px 0 var(--key-edge);
        color: var(--label);
        font: 600 15px/1 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        letter-spacing: 0.06em;
        touch-action: none;
      }
      .pad button.down {
        background: var(--key-down);
        box-shadow: inset 0 -1px 0 var(--key-edge);
        transform: translateY(3px);
      }
      .pad button[data-key="enter"] { color: var(--accent); }
      .pad button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* Screen-specific commands (REROLL, SEARCH...). Height is reserved even
         when empty so the game doesn't rescale between screens. */
      #actions {
        grid-area: actions;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 10px;
        min-height: 60px;
        padding: 6px 12px;
        box-sizing: border-box;
      }
      #actions button {
        min-height: 44px;
        padding: 0 16px;
        border: 0;
        border-radius: 6px;
        background: var(--key);
        box-shadow: inset 0 -4px 0 var(--key-edge);
        color: var(--accent);
        font: 600 15px/1 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        letter-spacing: 0.06em;
        cursor: pointer;
        touch-action: none;
      }
      #actions button:hover { background: #3a3a3a; }
      #actions button.down {
        background: var(--key-down);
        box-shadow: inset 0 -1px 0 var(--key-edge);
        transform: translateY(3px);
      }
      #actions kbd {
        margin-left: 6px;
        padding: 1px 5px;
        border: 1px solid #666;
        border-radius: 3px;
        color: var(--label);
        font: inherit;
        font-size: 12px;
      }
      body.touch #actions kbd { display: none; }

      /* Off-screen but focusable, so the phone keyboard can open for it. */
      #soft-input {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 1px;
        height: 1px;
        opacity: 0;
        border: 0;
        padding: 0;
        font-size: 16px;
      }
      noscript { color: #ccc; font: 16px/1.5 system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="screen" aria-label="Game screen" tabindex="0"></canvas>
    </div>

    <div id="actions" aria-label="Commands"></div>

    <div id="pad-left" class="pad" aria-label="Direction pad">
      <div class="dpad">
        <button type="button" data-key="up" aria-label="Up">&#9650;</button>
        <button type="button" data-key="left" aria-label="Left">&#9664;</button>
        <button type="button" data-key="right" aria-label="Right">&#9654;</button>
        <button type="button" data-key="down" aria-label="Down">&#9660;</button>
      </div>
    </div>

    <div id="pad-right" class="pad" aria-label="Action keys">
      <div class="keys">
        <button type="button" class="wide" data-key="enter">ENTER</button>
        <button type="button" data-key="back">BACK</button>
        <button type="button" id="soft-toggle" aria-label="Show keyboard">ABC</button>
      </div>
    </div>

    <input
      id="soft-input"
      type="text"
      aria-label="Keyboard input"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="characters"
      spellcheck="false"
      enterkeyhint="go"
      tabindex="-1"
    />

    <noscript>This game needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
